# Multi-AZ EC2 Node Deployment Stack (1 EC2 instance per Availability Zone)
# Use behind an AWS Application Load Balancer (ALB) across ap-south-1a & ap-south-1b.
# Deploy via:
#   Zone A (Primary): ./scripts/deploy-ec2.sh --mode az-primary --region ap-south-1a
#   Zone B (Replica): ./scripts/deploy-ec2.sh --mode az-replica --region ap-south-1b --primary-ip <ZONE_A_PRIVATE_IP> ...

services:
  redis:
    image: redis:7-alpine
    container_name: aadhaar_redis_az
    environment:
      REDIS_REPLICAOF_HOST: ${REDIS_REPLICAOF_HOST:-}
      REDIS_REPLICAOF_PORT: ${REDIS_REPLICAOF_PORT:-6379}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_REPLICAOF_HOST" ]; then
          exec redis-server --save "" --appendonly no --maxmemory 160mb --maxmemory-policy volatile-ttl --replicaof "$$REDIS_REPLICAOF_HOST" "$$REDIS_REPLICAOF_PORT" --replica-read-only yes
        else
          exec redis-server --save "" --appendonly no --maxmemory 160mb --maxmemory-policy volatile-ttl
        fi
    ports:
      # Restrict 6379 in AWS Security Group to the peer AZ EC2 Security Group / private VPC CIDR only
      - "${REDIS_BIND_IP:-0.0.0.0}:${REDIS_PORT:-6379}:6379"
    networks:
      - az_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: aadhaar_auth_az
    ports:
      - "${HTTP_PORT:-80}:3000"
    environment:
      PORT: 3000
      REGION: ${REGION:-ap-south-1a}
      INSTANCE_ID: ${INSTANCE_ID:-}
      CACHE_DRIVER: redis
      REDIS_URL: redis://redis:6379
      REDIS_PRIMARY_URL: ${REDIS_PRIMARY_URL:-redis://redis:6379}
      REDIS_AUTO_PROMOTE: ${REDIS_AUTO_PROMOTE:-true}
      REDIS_WAIT_REPLICAS: ${REDIS_WAIT_REPLICAS:-0}
      REDIS_WAIT_TIMEOUT_MS: ${REDIS_WAIT_TIMEOUT_MS:-50}
      HMAC_SECRET: ${HMAC_SECRET:-aadhaar-prototype-aua-hmac-secret-2026}
      AES_KEY: ${AES_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      REQUIRE_HMAC: ${REQUIRE_HMAC:-true}
      DEMO_RETURN_OTP: ${DEMO_RETURN_OTP:-true}
      OTP_TTL_SEC: ${OTP_TTL_SEC:-300}
      REPLAY_TTL_SEC: ${REPLAY_TTL_SEC:-60}
      LOG_MOCK_SMS: ${LOG_MOCK_SMS:-false}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - az_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  az_net:
    driver: bridge
