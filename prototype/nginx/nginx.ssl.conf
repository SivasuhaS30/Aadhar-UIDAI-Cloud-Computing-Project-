user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format aadhaar_upstream '[$time_local] client=$remote_addr '
                                'method=$request_method uri="$request_uri" status=$status '
                                'upstream=$upstream_addr upstream_status=$upstream_status '
                                'upstream_response_time=${upstream_response_time}s';

    access_log /var/log/nginx/access.log aadhaar_upstream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    upstream auth_cluster {
        server region1_auth:3000 max_fails=2 fail_timeout=5s;
        server region2_auth:3000 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    # Redirect plain HTTP to HTTPS while permitting ACME HTTP-01 challenges
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # TLS-terminated HTTPS endpoint (mount fullchain.pem + privkey.pem into /etc/nginx/certs)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = / {
            root /usr/share/nginx/html;
            index index.html;
            try_files /index.html =404;
        }

        location = /nginx-health {
            default_type application/json;
            return 200 '{"status":"UP","component":"nginx-load-balancer","tls":true}\n';
        }

        location / {
            proxy_pass http://auth_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
    }
}

