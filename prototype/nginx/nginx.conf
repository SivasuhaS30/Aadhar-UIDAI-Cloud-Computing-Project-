user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Detailed access log tracking upstream region routing and failover
    log_format aadhaar_upstream '[$time_local] client=$remote_addr '
                                'method=$request_method uri="$request_uri" status=$status '
                                'upstream=$upstream_addr upstream_status=$upstream_status '
                                'upstream_response_time=${upstream_response_time}s';

    access_log /var/log/nginx/access.log aadhaar_upstream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Upstream cluster simulating dual active-active regions
    # Region 1: Mumbai (ap-south-1)
    # Region 2: Hyderabad (ap-south-2)
    upstream auth_cluster {
        server region1_auth:3000 max_fails=2 fail_timeout=5s;
        server region2_auth:3000 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Baseline hardening headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Live operational & regional telemetry dashboard at root URL
        location = / {
            root /usr/share/nginx/html;
            index index.html;
            try_files /index.html =404;
        }

        # Direct health check for the load balancer itself
        location = /nginx-health {
            default_type application/json;
            return 200 '{"status":"UP","component":"nginx-load-balancer"}\n';
        }

        # Forward all authentication and microservice health requests across regions
        location / {
            proxy_pass http://auth_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Passive Failover & Zero-Downtime Retry (Test T4)
            # If region1 fails mid-request, transparently retry on region2
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            # Aggressive timeouts to satisfy UIDAI sub-second latency targets
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
    }
}
